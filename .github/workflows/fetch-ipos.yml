name: Fetch IPO data

on:
  schedule:
    # 12:00 AM IST = 18:30 UTC previous day
    - cron: "30 18 * * *"

    # 10:00 AM IST = 04:30 UTC
    - cron: "30 4 * * *"

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch IPO data from Upstox
        env:
          UPSTOX_EXTENDED_TOKEN: ${{ secrets.UPSTOX_EXTENDED_TOKEN }}
        run: python fetch_ipos.py

      - name: Commit updated ipos.json
        run: |
          git config user.name "ipo-ledger-bot"
          git config user.email "actions@users.noreply.github.com"

          git add ipos.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update IPO data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
